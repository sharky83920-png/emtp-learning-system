<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 EMTP 學員系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; line-height: 1.6; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-card { background: white; padding: 36px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .login-card h1 { color: #1e293b; font-size: 24px; margin-bottom: 8px; text-align: center; }
    .login-card .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; color: #475569; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 11px 14px; background: #f8fafc; border: 2px solid #e2e8f0; color: #1e293b; border-radius: 8px; font-family: inherit; font-size: 15px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #6366f1; background: white; }
    .form-group input:disabled, .form-group select:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 13px; border-radius: 8px; font-family: inherit; font-size: 15px; cursor: pointer; font-weight: 600; margin-top: 8px; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .err-msg { background: #fef2f2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; border: 1px solid #fecaca; }
    .info-msg { background: #eff6ff; color: #1e40af; padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-top: 12px; border: 1px solid #bfdbfe; }
    .dashboard { display: none; }
    .header { background: white; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 20px; color: #1e293b; }
    .user-info { display: flex; align-items: center; gap: 12px; color: #64748b; font-size: 14px; }
    .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; }
    .btn-logout:hover { background: #dc2626; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .welcome-card { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 32px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(102,126,234,0.3); }
    .welcome-card h2 { font-size: 28px; margin-bottom: 8px; }
    .welcome-card .class-info { opacity: 0.9; font-size: 16px; }
    .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .feature-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
    .feature-card .icon { font-size: 36px; margin-bottom: 12px; }
    .feature-card h3 { color: #1e293b; font-size: 18px; margin-bottom: 6px; }
    .feature-card .desc { color: #64748b; font-size: 13px; margin-bottom: 12px; }
    .feature-card .value { color: #6366f1; font-size: 32px; font-weight: bold; }
    .feature-card .unit { color: #94a3b8; font-size: 14px; margin-left: 4px; }
    .feature-card.disabled { opacity: 0.5; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
    .tag-enabled { background: #d1fae5; color: #065f46; }
    .tag-disabled { background: #f3f4f6; color: #6b7280; }
    .loading { text-align: center; padding: 40px; color: #64748b; }
  </style>
</head>
<body>

  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <h1>📚 EMTP 學員系統</h1>
      <p class="subtitle">選班級 + 姓名、輸入身分證登入</p>

      <div class="form-group">
        <label>1. 班級</label>
        <select id="login-class" disabled><option value="">⏳ 載入中...</option></select>
      </div>
      <div class="form-group">
        <label>2. 姓名</label>
        <select id="login-name" disabled><option value="">請先選班級</option></select>
      </div>
      <div class="form-group">
        <label>3. 身分證字號</label>
        <input type="text" id="login-id" maxlength="10" placeholder="A123456789" style="text-transform:uppercase;font-family:monospace">
      </div>
      <button class="btn-primary" id="btn-login">登入</button>
      <div id="login-error"></div>
      <div class="info-msg">💡 第一次使用：密碼 = 身分證字號</div>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <header class="header">
      <h1>📚 EMTP 學員系統</h1>
      <div class="user-info">
        <span id="user-name">—</span>
        <button class="btn-logout" id="btn-logout">登出</button>
      </div>
    </header>

    <main>
      <div class="welcome-card">
        <h2>👋 歡迎、<span id="student-name">同學</span></h2>
        <div class="class-info">🏫 班級：<span id="student-class">—</span> ・ 學號：<span id="student-no">—</span></div>
      </div>
      <div class="feature-grid" id="features"><div class="loading">⏳ 載入中...</div></div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYRUG97mj3JRz6YNRuN_UdRzgZcC1y9YE",
      authDomain: "emtp-learning-system.firebaseapp.com",
      projectId: "emtp-learning-system",
      storageBucket: "emtp-learning-system.firebasestorage.app",
      messagingSenderId: "1057617665185",
      appId: "1:1057617665185:web:2d1902083fa21af0e7a4e0",
      measurementId: "G-HQRYX3NJ78"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentStudent = null;

    function showLogin(errMsg) {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      if (errMsg) {
        document.getElementById('login-error').innerHTML = `<div class="err-msg">❌ ${errMsg}</div>`;
      }
      loadClasses();
    }

    async function loadClasses() {
      const sel = document.getElementById('login-class');
      sel.disabled = true;
      sel.innerHTML = '<option value="">⏳ 載入中...</option>';
      try {
        console.log('[Init] Loading classes...');
        const snap = await getDocs(collection(db, 'classes'));
        const classes = [];
        snap.forEach(d => { const data = d.data(); if (data.isActive !== false) classes.push({ id: d.id, ...data }); });
        classes.sort((a, b) => (b.year || 0) - (a.year || 0));
        console.log('[Init] Loaded', classes.length, 'classes');
        let html = '<option value="">請選班級...</option>';
        classes.forEach(c => { html += `<option value="${c.id}">${c.displayName || c.id}</option>`; });
        sel.innerHTML = html;
        sel.disabled = false;
      } catch (e) {
        console.error('[Init] Failed to load classes:', e);
        sel.innerHTML = `<option value="">❌ 載入失敗</option>`;
      }
    }

    document.getElementById('login-class').addEventListener('change', async () => {
      const classId = document.getElementById('login-class').value;
      const sel = document.getElementById('login-name');
      if (!classId) { sel.innerHTML = '<option value="">請先選班級</option>'; sel.disabled = true; return; }
      sel.innerHTML = '<option value="">⏳ 載入學員...</option>';
      sel.disabled = true;
      try {
        console.log('[Init] Loading students for', classId);
        const q = query(collection(db, 'students'), where('classId', '==', classId));
        const snap = await getDocs(q);
        const students = [];
        snap.forEach(d => { const data = d.data(); if (data.isActive !== false && data.hasAuthAccount) students.push(data); });
        students.sort((a, b) => (a.studentNo || 0) - (b.studentNo || 0));
        console.log('[Init] Loaded', students.length, 'students');
        if (students.length === 0) {
          sel.innerHTML = '<option value="">⚠️ 該班沒有學員（請聯絡管理員）</option>';
          return;
        }
        let html = '<option value="">請選姓名...</option>';
        students.forEach(s => { html += `<option value="${s.studentNo}|${s.name}">${s.studentNo}. ${s.name}</option>`; });
        sel.innerHTML = html;
        sel.disabled = false;
      } catch (e) {
        console.error('[Init] Failed to load students:', e);
        sel.innerHTML = `<option value="">❌ ${e.message}</option>`;
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const classId = document.getElementById('login-class').value;
      const nameValue = document.getElementById('login-name').value;
      const idNumber = document.getElementById('login-id').value.trim().toUpperCase();
      const errEl = document.getElementById('login-error');
      errEl.innerHTML = '';
      if (!classId) { errEl.innerHTML = '<div class="err-msg">❌ 請選班級</div>'; return; }
      if (!nameValue) { errEl.innerHTML = '<div class="err-msg">❌ 請選姓名</div>'; return; }
      if (!/^[A-Z]\d{9}$/.test(idNumber)) { errEl.innerHTML = '<div class="err-msg">❌ 身分證格式錯誤（1 個英文字母 + 9 個數字）</div>'; return; }

      const [studentNo, name] = nameValue.split('|');
      const fakeEmail = `${classId.toLowerCase()}-${studentNo}@emtp.local`;
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = '⏳ 登入中...';

      try {
        console.log('[Login] Attempting:', { classId, studentNo, name, fakeEmail });
        await signInWithEmailAndPassword(auth, fakeEmail, idNumber);
        console.log('[Login] Sign-in success');
      } catch (e) {
        console.error('[Login] Failed:', e);
        let msg = '登入失敗';
        if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password') msg = '身分證錯誤';
        else if (e.code === 'auth/user-not-found') msg = '帳號未建立、請聯絡管理員';
        else msg = e.message;
        errEl.innerHTML = `<div class="err-msg">❌ ${msg}</div>`;
        btn.disabled = false; btn.textContent = '登入';
      }
    });

    document.getElementById('login-id').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });

    onAuthStateChanged(auth, async (user) => {
      console.log('[Auth] state changed:', user?.email || 'null');
      if (!user) {
        showLogin();
        return;
      }
      const match = user.email.match(/^([^-]+)-(\d+)@emtp\.local$/);
      if (!match) {
        console.warn('[Auth] not a student email');
        await signOut(auth);
        showLogin('此帳號不是學員');
        return;
      }
      const classId = match[1].toUpperCase();
      const studentNo = parseInt(match[2]);
      const studentId = `${classId.toLowerCase()}-${studentNo}`;
      console.log('[Auth] Querying student doc:', studentId);

      try {
        const sDoc = await getDoc(doc(db, 'students', studentId));
        console.log('[Auth] doc exists:', sDoc.exists());
        if (!sDoc.exists()) {
          await signOut(auth);
          showLogin('找不到學員資料');
          return;
        }
        currentStudent = { id: sDoc.id, ...sDoc.data() };
        if (currentStudent.isActive === false) {
          await signOut(auth);
          showLogin('帳號已封存、請聯絡管理員');
          return;
        }
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('user-name').textContent = currentStudent.name;
        document.getElementById('student-name').textContent = currentStudent.name || '同學';
        document.getElementById('student-no').textContent = currentStudent.studentNo || '—';
        await loadDashboard();
      } catch (e) {
        console.error('[Auth] error:', e);
        // ⭐ 不要 signOut、避免無限循環、只顯示錯誤
        document.getElementById('login-error').innerHTML = `<div class="err-msg">❌ 讀取失敗: ${e.message}<br>請重整頁面再試</div>`;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    async function loadDashboard() {
      if (!currentStudent) return;
      try {
        const classDoc = await getDoc(doc(db, 'classes', currentStudent.classId));
        if (!classDoc.exists()) {
          document.getElementById('student-class').textContent = currentStudent.classId;
          document.getElementById('features').innerHTML = '<div class="err-msg">⚠️ 找不到班級資料</div>';
          return;
        }
        const classData = classDoc.data();
        document.getElementById('student-class').textContent = classData.displayName || currentStudent.classId;
        const s = classData.settings || {};
        const eb = s.energyBar || { enabled: false };
        const mb = s.mistakeBook || { enabled: false };
        const lb = s.leaderboard || { enabled: true };

        let html = '';
        if (eb.enabled) {
          const periodName = eb.period === 'monthly' ? '本月' : '本週';
          html += `<div class="feature-card"><div class="icon">⚡</div><h3>能量條 <span class="tag tag-enabled">啟用中</span></h3><div class="desc">${periodName}目標：${eb.target} 趟</div><div><span class="value">0</span><span class="unit">/ ${eb.target} 趟</span></div></div>`;
        } else {
          html += `<div class="feature-card disabled"><div class="icon">⚡</div><h3>能量條 <span class="tag tag-disabled">未啟用</span></h3><div class="desc">指導員尚未開啟</div></div>`;
        }
        html += `<div class="feature-card ${mb.enabled ? '' : 'disabled'}"><div class="icon">📓</div><h3>錯題本 <span class="tag ${mb.enabled ? 'tag-enabled' : 'tag-disabled'}">${mb.enabled ? '啟用中' : '未啟用'}</span></h3><div class="desc">⏳ F11 開發中</div></div>`;
        html += `<div class="feature-card ${lb.enabled ? '' : 'disabled'}"><div class="icon">🏆</div><h3>戰力排行 <span class="tag ${lb.enabled ? 'tag-enabled' : 'tag-disabled'}">${lb.enabled ? '啟用中' : '未啟用'}</span></h3><div class="desc">⏳ F11 開發中</div></div>`;
        html += `<div class="feature-card"><div class="icon">📝</div><h3>答題系統 <span class="tag tag-disabled">F11 建置中</span></h3><div class="desc">隨機綜合測驗、章節練習等</div></div>`;
        document.getElementById('features').innerHTML = html;
      } catch (e) {
        document.getElementById('features').innerHTML = `<div class="err-msg">${e.message}</div>`;
      }
    }

    document.getElementById('btn-logout').addEventListener('click', () => { if (confirm('確定要登出嗎？')) signOut(auth); });
  </script>
</body>
</html>
